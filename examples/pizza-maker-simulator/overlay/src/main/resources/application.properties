########################################################################
# Default / %prod profile
# Values are read from env vars so the same jar/image works against the
# docker-compose stack (make up) and against a real environment later.
# Defaults match infra/ and docker-compose.yml exactly.
########################################################################
quarkus.application.name=service

# --- Postgres: domain + regulatory state ---
# jdbc.url/username/password are %dev,prod only (NOT global): if they were
# set unconditionally, Quarkus would see the datasource as "already
# configured" under %test too and skip Dev Services, which is what gives
# `mvn test` its own disposable Postgres container without `make up`.
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.username=${APP_DB_USER:app}
%dev,prod.quarkus.datasource.password=${APP_DB_PASSWORD:app}
%dev,prod.quarkus.datasource.jdbc.url=${APP_DB_URL:jdbc:postgresql://localhost:5432/appdb}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
# Hibernate's own default naming strategy does NOT convert "PizzaOrder" /
# "customerName" to "pizza_order" / "customer_name" (that's a Spring Boot
# default, not a Hibernate one) - without this, entity/column names must
# match Flyway-created table/column names exactly, verbatim. This makes
# them follow the same snake_case convention Flyway migrations use here.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Kafka: notification / event pub-sub ---
# Same reasoning as the datasource above: %dev,prod only, so %test gets a
# Dev Services-provisioned Kafka instead of trying to reach a real one.
%dev,prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# pizza-maker-simulator: one event per order status transition
mp.messaging.outgoing.order-events.connector=smallrye-kafka
mp.messaging.outgoing.order-events.topic=order-events
mp.messaging.outgoing.order-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Temporal: orchestration state (timers, retries, workflow position) ---
temporal.service-address=${TEMPORAL_ADDRESS:localhost:7233}
temporal.namespace=${TEMPORAL_NAMESPACE:default}
temporal.task-queue=${TEMPORAL_TASK_QUEUE:service-task-queue}

# --- Mocked external dependency: also reused as the pizza-maker-simulator's
# mocked payment gateway (see routes/PaymentGatewayRoute.java) ---
registry.base-url=${REGISTRY_BASE_URL:http://localhost:8090}

# --- Ops ---
quarkus.http.port=${APP_HTTP_PORT:8080}
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

########################################################################
# %dev profile (mvn quarkus:dev) — same compose stack as %prod, just with
# live reload. Dev Services are disabled because we have real, persistent
# containers via `make up` instead of ephemeral ones.
########################################################################
%dev.quarkus.datasource.devservices.enabled=false
%dev.kafka-devservices.enabled=false

########################################################################
# %test profile (mvn test) — deliberately left unconfigured for
# datasource/Kafka so Quarkus Dev Services spin up disposable Testcontainers
# automatically. This gives a hermetic "test locally end to end" run that
# does not depend on `make up` being active. See docs/FIRST-STEPS.md.
########################################################################
%test.temporal.service-address=localhost:7233
